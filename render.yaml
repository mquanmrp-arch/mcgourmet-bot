services:
  - type: web
    name: mcgourmet-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn mcgourmet_bot:flask_app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: mcgourmet_db
          property: connectionString
      - key: GMAIL_USER
        value: "inputmcgourmet@gmail.com"
      - key: EMAIL_DESTINO
        value: "mcp.gourmet@gmail.com"
      - key: GMAIL_PASSWORD
        sync: false

databases:
  - name: mcgourmet_db
    plan: free
